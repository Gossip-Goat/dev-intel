[project]
name = "dev-intel"
version = "0.1.0"
description = "Competitor property development intelligence: permitted scraping, identified inquiries, document extraction, data lake."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.12",
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.35", "psycopg[binary]>=3.2"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
